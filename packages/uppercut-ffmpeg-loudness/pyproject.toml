[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-ffmpeg-loudness"
version = "1.0.0"
description = "Measure integrated loudness and true peak with ffmpeg, then apply gain or normalize to a target."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
dependencies = []
keywords = ["ffmpeg", "loudness", "lufs", "ebur128", "loudnorm", "true-peak"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-ffmpeg-loudness"

[project.scripts]
uppercut-ffmpeg-loudness = "uppercut_ffmpeg_loudness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_ffmpeg_loudness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
