[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-pixel-art-sheets"
version = "0.1.0"
description = "Pillow helpers for indexed pixel-art sheets: palettes, pattern fills, a bitmap font and sheet packing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
dependencies = ["Pillow>=10"]
keywords = ["pixel art", "sprite sheet", "indexed png", "palette", "pillow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-pixel-art-sheets"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_pixel_art_sheets"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
