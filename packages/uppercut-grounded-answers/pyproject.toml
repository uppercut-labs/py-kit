[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-grounded-answers"
version = "1.0.0"
description = "Answer from retrieved evidence with typed provider failures, failover between providers and citation validation. Endpoints and model names are configuration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["rag", "citations", "grounding", "failover", "llm", "retrieval", "ollama", "openai-compatible"]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-grounded-answers"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_grounded_answers"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
