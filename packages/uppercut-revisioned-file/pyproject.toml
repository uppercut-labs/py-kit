[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-revisioned-file"
version = "1.0.0"
description = "Atomic file writes (fsynced temporary file, os.replace, directory fsync) and a whole-file store with opaque revisions, 409-style conflicts and fsynced backups."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["atomic", "fsync", "os.replace", "json", "revision", "optimistic-concurrency", "backup"]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-revisioned-file"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_revisioned_file"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
