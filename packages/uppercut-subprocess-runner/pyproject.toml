[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-subprocess-runner"
version = "0.1.0"
description = "Run a subprocess with a timeout, an output cap and cancellation, and kill its whole process tree."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["subprocess", "timeout", "process-tree", "kill", "sigterm", "taskkill"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-subprocess-runner"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_subprocess_runner"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
