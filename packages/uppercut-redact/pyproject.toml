[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-redact"
version = "0.1.0"
description = "Scrub credential-shaped text (bearer tokens, key=value secrets, URL passwords) and mask or drop sensitive keys in logs, errors and telemetry. Standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["redact", "secrets", "logging", "scrub", "bearer", "token", "telemetry", "privacy"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-redact"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_redact"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
