[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-sound-effect-synth"
version = "0.1.0"
description = "Deterministic procedural sound effects: envelopes, filtered noise, sweeps, seeded variation and WAV output."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
dependencies = ["numpy>=1.24"]
keywords = ["sound-effects", "synthesis", "procedural-audio", "wav", "deterministic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/py-kit/tree/main/packages/uppercut-sound-effect-synth"

[project.scripts]
uppercut-sound-effect-synth = "uppercut_sound_effect_synth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_sound_effect_synth"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
