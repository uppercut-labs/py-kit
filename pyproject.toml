[project]
name = "py-kit-workspace"
version = "0"
requires-python = ">=3.10"
description = "Workspace root for the Uppercut Labs Python packages. Not published."

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest==8.4.2", "jsonschema==4.26.0"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
